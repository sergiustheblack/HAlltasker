sync_now:
  name: Sync now
  description: Run one sync cycle for a pair, or for every pair, immediately.
  fields:
    pair_id:
      name: Pair
      description: Id of the pair from configuration.yaml; omit to run all pairs.
      example: yandex_to_icloud
      selector:
        text:

dry_run:
  name: Dry run
  description: Plan one cycle without writing and return the planned actions.
  fields:
    pair_id:
      name: Pair
      description: Id of the pair from configuration.yaml; omit to plan all pairs.
      example: yandex_to_icloud
      selector:
        text:
